services:
  app:
    image: 'sha256:9c8cbf51569f615b8a8349c990f6b85b1185cf6671706f91b62becefe3507076'
    container_name: app
    expose:
      - '8080'
    ports:
      - '8080:8080'

    depends_on:
      - db
  db:
    image: 'sha256:8775adb39f0db45cf4cdb3601380312ee5e9c4f53af0f89b7dc5cd4c9a78e4e8'
    container_name: db
    expose:
      - '5432'
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=blogDB
